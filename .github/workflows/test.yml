name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group casadi --group reference --group examples
      - name: Format
        run: uvx ruff@0.17.6 format --check
      - name: Lint
        run: uvx ruff@0.17.6 check
      - name: Test
        run: uv run pytest -q
